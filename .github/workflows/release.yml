name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install compiler dependency
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Derive version from tag
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify tag matches tracked source version
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          platform = Path("hardware/nrf54l15clean/nrf54l15clean")
          platform_version = next(
              line.split("=", 1)[1]
              for line in (platform / "platform.txt").read_text().splitlines()
              if line.startswith("version=")
          )
          if platform_version != version:
              raise SystemExit(
                  f"tag version {version!r} != tracked platform version "
                  f"{platform_version!r}"
              )
          for header in sorted((platform / "cores").glob("*/CoreVersionGenerated.h")):
              match = re.search(
                  r'^#define ARDUINO_NRF54L15_CLEAN_VERSION_STRING "([^"]+)"$',
                  header.read_text(),
                  flags=re.MULTILINE,
              )
              if match is None or match.group(1) != version:
                  actual = match.group(1) if match is not None else "<missing>"
                  raise SystemExit(
                      f"tag version {version!r} != {header} version {actual!r}"
                  )
          PY

      - name: Reset dist
        run: |
          rm -rf dist
          mkdir -p dist

      - name: Build release artifacts
        run: |
          if [ -d "hardware/nrf54l15clean/nrf54l15clean" ]; then
            SOURCE_VERSION="nrf54l15clean"
          else
            SOURCE_VERSION="$(ls -1 hardware/nrf54l15clean | sort -V | tail -n1)"
          fi
          ./scripts/build_release.py \
            --version "${{ steps.vars.outputs.version }}" \
            --source-version "${SOURCE_VERSION}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v{version}" \
            --reuse-existing-hosttools

      - name: Verify release build did not rewrite tracked version files
        run: |
          git diff --exit-code -- \
            hardware/nrf54l15clean/nrf54l15clean/platform.txt \
            hardware/nrf54l15clean/nrf54l15clean/cores/nrf54l15/CoreVersionGenerated.h \
            hardware/nrf54l15clean/nrf54l15clean/cores/nrf54lm20b/CoreVersionGenerated.h

      - name: Verify checksum and size
        run: |
          PLATFORM_ARCHIVE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(manifest['platform']['archivePath'])
          PY
          )"
          INDEX_LIST="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(*manifest['indexes']['artifact'], sep='\n')
          PY
          )"
          test -n "${INDEX_LIST}"
          mapfile -t INDEXES <<< "${INDEX_LIST}"
          for INDEX in "${INDEXES[@]}"; do
            python3 ./scripts/verify_package_index.py \
              --index "${INDEX}" \
              --archive "${PLATFORM_ARCHIVE}" \
              --version "${{ steps.vars.outputs.version }}"
          done

      - name: Compile advertised features from exact archive
        run: |
          PLATFORM_ARCHIVE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(manifest['platform']['archivePath'])
          PY
          )"
          python3 ./scripts/verify_release_archive.py --archive "${PLATFORM_ARCHIVE}"

      - name: Verify tracked package indexes match release build
        run: |
          diff -u package_nrf54l15clean_index.json dist/package_nrf54l15clean_index.json
          diff -u package_nrf54l15clean_stable_index.json dist/package_nrf54l15clean_stable_index.json
          diff -u package_nrf54l15clean_archive_index.json dist/package_nrf54l15clean_archive_index.json

      - name: Remove stale assets from existing tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.vars.outputs.version }}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            exit 0
          fi
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq '.[] | [.id, .name] | @tsv' | \
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            case "${ASSET_NAME}" in
              "nrf54l15clean-${VERSION}-"*.tar.bz2|package_nrf54l15clean_index.json|package_nrf54l15clean_stable_index.json|package_nrf54l15clean_archive_index.json|release-manifest.json)
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
                ;;
            esac
          done

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          prerelease: ${{ steps.vars.outputs.prerelease }}
          make_latest: ${{ steps.vars.outputs.prerelease == 'false' }}
          files: |
            dist/*
          generate_release_notes: true

      - name: Verify public release bytes
        run: |
          RELEASE_INDEX="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(manifest['indexes']['release'])
          PY
          )"
          python3 ./scripts/verify_public_release.py \
            --index "${RELEASE_INDEX}" \
            --version "${{ steps.vars.outputs.version }}" \
            --include-tools \
            --retries 12 \
            --retry-delay 10
