    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install toolchain dependency
        run: |
          arduino-cli core update-index
          # Install a standard ARM platform to provision arm-none-eabi-gcc.
          arduino-cli core install arduino:mbed_nano

      - name: Register local clean core
        run: |
          mkdir -p "${HOME}/Arduino/hardware/localnrf54"
          ln -sfn "${GITHUB_WORKSPACE}/hardware/nrf54l15clean/nrf54l15clean" \
            "${HOME}/Arduino/hardware/localnrf54/nrf54l15clean"
          arduino-cli board details --fqbn "localnrf54:nrf54l15clean:xiao_nrf54l15" | \
            grep -F "localnrf54:nrf54l15clean:xiao_nrf54l15"

      - name: Compile ${{ matrix.sketch }}
        run: |
          arduino-cli compile \
            --fqbn "localnrf54:nrf54l15clean:xiao_nrf54l15:${{ matrix.options }}" \
            "${GITHUB_WORKSPACE}/${{ matrix.sketch }}"

  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Core I/O sanitizer and vector contracts
        run: python3 ./scripts/test_core_io_regressions.py

      - name: Bluefruit client, HID, signed-write, and DFU contracts
        run: python3 ./scripts/test_bluefruit_client_contracts.py

      - name: Upload recovery and platform recipe contracts
        run: python3 ./scripts/test_upload_helper.py

      - name: Release version and prerelease contracts
        run: python3 ./scripts/test_release_versions.py

      - name: XIAO nRF54LM20A Sense PDM contracts
        run: python3 ./scripts/test_lm20a_pdm_contract.py

      - name: CRACEN IKG fail-closed contracts
        run: python3 ./scripts/test_cracen_ikg_contract.py

      - name: nRF54LM20A CRACEN RNG register contracts
        run: python3 ./scripts/test_lm20a_cracen_rng_header.py

  audit-contract-compiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: xiao_nrf54l15
            options: cpu_freq=64m
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/Diagnostics/HalRegisterContracts
          - board: xiao_nrf54lm20b
            options: cpu_freq=128m
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/Diagnostics/HalRegisterContracts
          - board: xiao_nrf54l15
            options: cpu_freq=64m
            sketch: hardware/nrf54l15clean/nrf54l15clean/examples/Power/SystemOffWakeDiag
          - board: xiao_nrf54lm20b
            options: cpu_freq=128m
            sketch: hardware/nrf54l15clean/nrf54l15clean/examples/Power/SystemOffWakeDiag
          - board: nrf54l15dk_pca10156
            options: clean_serial=header
            sketch: hardware/nrf54l15clean/nrf54l15clean/examples/Serial/SerialDualBaudRemapProbe
          - board: xiao_nrf54l15
            options: cpu_freq=64m
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Bluefruit52Lib/examples/HID/blehid_mouse
          - board: xiao_nrf54lm20b
            options: clean_ble=on,cpu_freq=128m
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/BLE/ChannelSounding/BleChannelSoundingInitiator
          - board: xiao_nrf54lm20b
            options: clean_ble=on,cpu_freq=128m
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/BLE/ChannelSounding/BleChannelSoundingReflector
          - board: xiao_nrf54l15
            options: clean_ble=on,cpu_freq=128m
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/BLE/ChannelSounding/BleChannelSoundingInitiator
          - board: xiao_nrf54l15
            options: clean_ble=on,cpu_freq=128m
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/BLE/ChannelSounding/BleChannelSoundingReflector
          - board: xiao_nrf54l15
            options: clean_thread=stage
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/Thread/ThreadExperimentalJoinerPSK
          - board: xiao_nrf54l15
            options: clean_thread=stage,clean_matter=stage
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/Matter/MatterPaseCryptoTest
          - board: xiao_nrf54l15
            options: clean_ble=off
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/Zigbee/ZigbeeCoordinator
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install compiler dependency
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Register isolated local core
        run: |
          mkdir -p "${HOME}/Arduino/hardware/localnrf54"
          ln -sfn "${GITHUB_WORKSPACE}/hardware/nrf54l15clean/nrf54l15clean" \
            "${HOME}/Arduino/hardware/localnrf54/nrf54l15clean"

      - name: Compile audit contract
        run: |
          set -o pipefail
          build_log="${RUNNER_TEMP}/audit-contract-build.log"
          arduino-cli compile \
            --warnings all \
            --fqbn "localnrf54:nrf54l15clean:${{ matrix.board }}:${{ matrix.options }}" \
            "${GITHUB_WORKSPACE}/${{ matrix.sketch }}" 2>&1 | tee "${build_log}"
          if grep -Fq "warning:" "${build_log}"; then
            echo "Compiler warnings are not allowed in audit-contract builds."
            grep -F "warning:" "${build_log}"
            exit 1
          fi

  windows-native-tooling:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install compiler dependency
        shell: powershell
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Register isolated local core
        shell: powershell
        run: |
          arduino-cli config set directories.user "$env:RUNNER_TEMP/Arduino"
          $hardware = Join-Path $env:RUNNER_TEMP "Arduino/hardware/localnrf54/nrf54l15clean"
          New-Item -ItemType Directory -Path $hardware -Force | Out-Null
          Copy-Item -Path "hardware/nrf54l15clean/nrf54l15clean/*" -Destination $hardware -Recurse -Force

      - name: Compile through native Windows UF2 recipe
        shell: powershell
        run: |
          arduino-cli compile `
            --fqbn "localnrf54:nrf54l15clean:xiao_nrf54l15" `
            --build-path "$env:RUNNER_TEMP/nrf54-windows-build" `
            "hardware/nrf54l15clean/nrf54l15clean/examples/Basics/CoreVersionProbe"
          $uf2 = Get-Item "$env:RUNNER_TEMP/nrf54-windows-build/*.uf2"
          if ($uf2.Length -le 0) { throw "Windows compile did not emit UF2" }

      - name: Test Windows native tools
        shell: powershell
        run: ./tests/windows_native_tools.ps1

  package-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install compiler dependency
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Build release artifacts
        run: |
          if [ -d "hardware/nrf54l15clean/nrf54l15clean" ]; then
            SOURCE_VERSION="nrf54l15clean"
          else
            SOURCE_VERSION="$(ls -1 hardware/nrf54l15clean | sort -V | tail -n1)"
          fi
          VERSION="$(sed -n 's/^version=//p' "hardware/nrf54l15clean/${SOURCE_VERSION}/platform.txt" | head -n1)"
          test -n "${VERSION}"
          ./scripts/build_release.py \
            --version "${VERSION}" \
            --source-version "${SOURCE_VERSION}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v{version}" \
            --reuse-existing-hosttools

      - name: Ensure checked-in index matches generated index
        run: |
          diff -u dist/package_nrf54l15clean_index.json package_nrf54l15clean_index.json
